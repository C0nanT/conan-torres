name: Build & Push Image

# Publishes the private production image to GHCR after CI passes on main, so
# the VPS only pulls it and never builds. The image carries no secret: the
# build reads no env var, .env* is dockerignored, and READER_PASSWORD,
# BOOK_FILE_* and APP_ENV come from the VPS .env at runtime.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/c0nant/conan-torres

jobs:
  build-push:
    # Only after a green CI run triggered by a push (not a PR from a branch
    # named main), or when started by hand.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # workflow_run starts on the default branch tip; build the exact commit
      # CI checked instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
