services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # read from the host shell or a .env next to this file (never committed)
      READER_PASSWORD: ${READER_PASSWORD:-}
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
