services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # read from the host shell or a .env next to this file (never committed)
      READER_PASSWORD: ${READER_PASSWORD:-}
      BOOK_FILE_MONOLITO_PARA_MICROSSERVICOS: ${BOOK_FILE_MONOLITO_PARA_MICROSSERVICOS:-}
      READER_DEBUG: ${READER_DEBUG:-}
    volumes:
      # reader's SQLite file (saved pages, highlights) and the downloaded book
      # PDFs; survives rebuilds
      - leitor-data:/app/reader-data
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  leitor-data:
