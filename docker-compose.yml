version: "3.9"

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
    command: ["pnpm", "run", "start"]
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
