# Production compose, behind the shared Traefik edge (traefik-default).
# On the VPS it lives in /opt/apps/conan-torres/ as `docker-compose.yml`,
# next to the uncommitted `.env`:
#   cp docker-compose.prod.yml /opt/apps/conan-torres/docker-compose.yml
# Local development keeps using docker-compose.yml (build + port 8080).

# Pinned so the volume below is always `conan-torres_leitor-data`, the same
# name the old compose created, whatever the folder is called.
name: conan-torres

services:
  web:
    # Private image built by CI (.github/workflows/deploy-image.yml); the VPS
    # never builds. Needs `docker login ghcr.io` (read:packages token) once.
    # Pin IMAGE_TAG in .env to a commit SHA to roll back or hold a version.
    image: ghcr.io/c0nant/conan-torres:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No `ports:`: all internet traffic enters through Traefik, which keeps
    # the reader's rate limit honest. Other containers on `proxy` can still
    # reach web:8080 directly (accepted risk, see AGENTS.md "Reader access").
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # from /opt/apps/conan-torres/.env (never committed)
      READER_PASSWORD: ${READER_PASSWORD:-}
      BOOK_FILE_MONOLITO_PARA_MICROSSERVICOS: ${BOOK_FILE_MONOLITO_PARA_MICROSSERVICOS:-}
      READER_DEBUG: ${READER_DEBUG:-}
      APP_ENV: ${APP_ENV:-production}
    volumes:
      # reader's SQLite file and cached book PDFs; survives down/up and
      # image swaps
      - leitor-data:/app/reader-data
    # Healthcheck: inherited from the image's Dockerfile HEALTHCHECK (polls
    # /api/health on 127.0.0.1:$PORT), the single source; not repeated here.
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # apex: wildcard certificate (DNS-01 on Cloudflare)
      - "traefik.http.routers.conan-torres.rule=Host(`conantorres.dev`)"
      - "traefik.http.routers.conan-torres.entrypoints=websecure"
      - "traefik.http.routers.conan-torres.middlewares=seguranca@file,compressao@file"
      - "traefik.http.routers.conan-torres.tls.certresolver=le-dns"
      - "traefik.http.routers.conan-torres.tls.domains[0].main=conantorres.dev"
      - "traefik.http.routers.conan-torres.tls.domains[0].sans=*.conantorres.dev"
      # www: permanent redirect to the apex (covered by the wildcard)
      - "traefik.http.routers.conan-torres-www.rule=Host(`www.conantorres.dev`)"
      - "traefik.http.routers.conan-torres-www.entrypoints=websecure"
      - "traefik.http.routers.conan-torres-www.middlewares=www-para-raiz@file"
      - "traefik.http.routers.conan-torres-www.service=conan-torres"
      - "traefik.http.services.conan-torres.loadbalancer.server.port=8080"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

networks:
  proxy:
    external: true

volumes:
  leitor-data:
